[project]
name = "tezcat"
version = "0.1.0"
description = "Tezcat: model-agnostic agent harness for Obsidian — ask the black mirror"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",       # imported directly (mcp_client timeouts), not just via mcp
    "jsonschema>=4.22",
    "mcp>=1.9",
    "openai>=1.60",
    "pyyaml>=6.0",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
]

[project.scripts]
harness = "harness.cli:main"
harness-eval = "harness.evals:main"
harness-worker-eval = "harness.worker_evals:main"
harness-watch = "harness.watcher:main"
harness-revert = "harness.revert:main"
harness-ui = "harness.ui:main"
harness-backends = "harness.backends:main"
obsidian-mcp = "obsidian_mcp.server:main"
files-mcp = "files_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_mcp", "src/harness", "src/files_mcp"]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
