[project]
name = "chickenskratch"
version = "0.1.0"
description = "Chickenskratch: a maintenance layer and its own surfaces over a folder of markdown"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",       # imported directly (mcp_client timeouts), not just via mcp
    "jsonschema>=4.22",
    "mcp>=1.9",
    "openai>=1.60",
    "pyyaml>=6.0",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
]

[project.scripts]
chickenskratch = "chickenskratch.cli:main"
chickenskratch-eval = "chickenskratch.evals:main"
chickenskratch-worker-eval = "chickenskratch.worker_evals:main"
chickenskratch-watch = "chickenskratch.watcher:main"
chickenskratch-revert = "chickenskratch.revert:main"
chickenskratch-ui = "chickenskratch.ui:main"
chickenskratch-backends = "chickenskratch.backends:main"
chickenskratch-vault-mcp = "chickenskratch_vault.server:main"
chickenskratch-files-mcp = "chickenskratch_files.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chickenskratch_vault", "src/chickenskratch", "src/chickenskratch_files"]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
