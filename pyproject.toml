[project]
name = "tezcat"
version = "0.1.0"
description = "Tezcat: a maintenance layer and its own surfaces over a folder of markdown"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",       # imported directly (mcp_client timeouts), not just via mcp
    "jsonschema>=4.22",
    "mcp>=1.9",
    "openai>=1.60",
    "pyyaml>=6.0",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
]

[project.scripts]
tezcat = "tezcat.cli:main"
tezcat-eval = "tezcat.evals:main"
tezcat-worker-eval = "tezcat.worker_evals:main"
tezcat-watch = "tezcat.watcher:main"
tezcat-revert = "tezcat.revert:main"
tezcat-ui = "tezcat.ui:main"
tezcat-backends = "tezcat.backends:main"
tezcat-vault-mcp = "tezcat_vault.server:main"
tezcat-files-mcp = "tezcat_files.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tezcat_vault", "src/harness", "src/tezcat_files"]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
