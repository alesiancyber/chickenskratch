<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage — Tezcat</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg); color: var(--text); padding-bottom: 40px;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; }
  header a { color: var(--accent); text-decoration: none; font-size: 13px; margin-left: auto; }
  .wrap { max-width: 900px; margin: 24px auto; padding: 0 16px; }
  .table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-1); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 8px 14px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: var(--chip); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.model { font-weight: 600; }
  td.num { font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .note { font-size: 12px; color: var(--muted); margin: 10px 2px; }
</style>
</head>
<body>
<header>
  <h1>Usage per model</h1>
  <a href="/">← back to chat</a>
</header>

<div class="wrap">
  <div class="table-wrap"><table id="table"></table></div>
  <p class="note">Totals across web and CLI runs (eval runs are excluded so
  benchmarks don't pollute usage). A run is one request→reply cycle, which
  may span several model calls. ~ marks models whose backend didn't report
  token usage, so counts include chars÷4 estimates.</p>
</div>

<script>
const esc = s => { const d = document.createElement("span"); d.textContent = s; return d.innerHTML; };
const fmt = n => n >= 10000 ? Math.round(n / 1000) + "k" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);

async function render() {
  const data = await (await fetch("/api/stats")).json();
  const models = Object.entries(data.models || {});
  if (!models.length) {
    document.querySelector(".table-wrap").innerHTML =
      '<div class="empty">No usage recorded yet — chat with a model first.</div>';
    return;
  }
  models.sort((a, b) => (b[1].input_tokens + b[1].output_tokens) - (a[1].input_tokens + a[1].output_tokens));
  const head = "<tr><th>model</th><th>runs</th><th>input tokens</th><th>output tokens</th><th>tool calls</th><th>last used</th></tr>";
  const rows = models.map(([name, m]) => {
    const est = m.estimated ? "~" : "";
    return `<tr>
      <td class="model">${esc(name)}</td>
      <td class="num">${m.runs}</td>
      <td class="num" title="${m.input_tokens}">${est}${fmt(m.input_tokens)}</td>
      <td class="num" title="${m.output_tokens}">${est}${fmt(m.output_tokens)}</td>
      <td class="num">${m.tool_calls}</td>
      <td>${esc(m.last_used || "")}</td>
    </tr>`;
  }).join("");
  document.getElementById("table").innerHTML = head + rows;
}

render();
setInterval(render, 15000);
</script>
</body>
</html>
