description: Drafts the minimal tool-call plan that fixes a note's entity-schema issues — never inventing, dropping, or rewording content.
inputs:
- note
- entity
- issues
- content
- new_id
- extra_ids
temperature: 0.1
max_tokens: 4000
prompt: |
  You maintain a markdown vault. The note below fails its entity schema.
  Draft the minimal fix as tool calls. Allowed tools and their args:
  - update_frontmatter: {{"path": ..., "key": ..., "value": ...}}  (value is a YAML string)
  - replace_section:    {{"path": ..., "heading": ..., "content": ...}}
  - append_to_note:     {{"path": ..., "content": ..., "section": ...}}

  Rules:
  - Use the note path exactly as given: {note}
  - If the schema requires an id in frontmatter, set it to exactly: {new_id}
  - Task lines missing an id get a block ref appended (last token on the
    line, e.g. ` ^t-1a2b3c`). Use these ids in order, one per line: {extra_ids}
  - Fix ONLY the listed issues. Keep every task's text, dates, and priorities
    byte-identical; never invent, drop, or reword content.
  {hedges}
  Return ONLY JSON of this shape, nothing else:
  {{"title": "short human title", "summary": "one sentence", "apply": [{{"tool": "...", "args": {{...}}}}]}}

  Entity type: {entity}
  Issues:
  {issues}

  Note content:
  {content}
schema:
  type: object
  required:
  - title
  - summary
  - apply
  properties:
    title:
      type: string
      minLength: 1
    summary:
      type: string
    apply:
      type: array
      minItems: 1
      items:
        type: object
        required:
        - tool
        - args
        properties:
          tool:
            enum:
            - update_frontmatter
            - replace_section
            - append_to_note
          args:
            type: object
hedges: |
  - Fix EVERY listed issue in this ONE plan — a plan that fixes only
    some of them re-drafts forever.
  - Use only the three tools above, with exactly the argument names
    shown; any other shape cannot be applied.
  - Never add lines beyond the required structure: no placeholder
    content, no example items, no invented sources.
