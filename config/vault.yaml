# Vault spec DEFAULTS. The vault describes itself:
# once a vault has a `Harness/Spec.md`, that note's frontmatter is the
# live source for folders/records/exclusions (edited like any note,
# read every engine pass). This file seeds new vaults and covers the
# no-vault-resolved case; surface paths and schemas_dir stay here
# (machine concerns, not note edits).
#
# folders: maps a top-level vault folder to the entity type of the notes
# and task lines inside it. A note's own signals still win: kanban-plugin
# frontmatter => kanban, then frontmatter `type:`, then this map, then
# the bare folder name lowercased.
#
# Folders are broad categories, not one per type: research notes live in
# Tasks/ typed by their own frontmatter (`type: research`); kanban boards
# live in Projects/ typed by their kanban-plugin frontmatter. The folder
# map is only the fallback for untyped notes.
#
# This map is a TEMPLATE for a vault nobody has seen yet, and it is the
# weakest thing in this file — it asserts a layout your vault has no
# reason to share. setup.sh does not use it: it reads the folders that
# actually hold notes and maps those, sending anything it can't type to
# `other`. What is left here covers the hand-rolled path (README step 4)
# and the case where no vault resolves at all.
folders:
  Tasks: task
  Meetings: meeting
  Notes: note
  Research: research
  Projects: project
  Daily: daily
  Scripts: script
  Captures: capture   # dated capture records, one note per day

# Entity schema files live in config/schemas/<type>.yaml (relative to
# this file's directory). Created and edited from the console's Schemas
# tab; the engine reads them fresh each pass.
schemas_dir: schemas

# Worker spec files (prompt + reply schema + hedges + bounds) live in
# config/workers/<name>.yaml (relative to this file's directory).
# Created and edited from the console's Behaviors tab; read fresh each
# pass — no restart.
workers_dir: workers

# Machine surfaces the harness owns inside the vault. The watcher never
# scans these and ignores its own writes to them.
#
# Capture is the only one: views (today/changes/review) are rendered by
# the dashboard and the `chickenskratch today` / `chickenskratch changes` verbs, never
# written into the vault, and consent is a dashboard button or `chickenskratch
# decide`. Capture.md is not a view — it is the canvas's write-ahead
# log, written before extraction so a dump survives extraction failing.
surfaces:
  capture: Harness/Capture.md

# Top-level folders that never enter model context. Enforced at the
# vault layer (resolve/iter_notes), not by prompt convention: reads,
# searches, task listings, and writes are all structurally blind to
# these. Secrets still don't belong in the vault at all — this is for
# sensitive *content*, not credentials.
exclude:
  - Private
