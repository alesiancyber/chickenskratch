# Model profiles — the only place model-specific settings live.
# Any OpenAI-compatible endpoint works: Ollama today, llama.cpp/vLLM on
# the network server later — add an entry and pass `-m <name>`.
#
# Note: Ollama's OpenAI endpoint uses the model's default context length.
# Raise it globally with `OLLAMA_CONTEXT_LENGTH=16384 ollama serve`, or
# bake it into a Modelfile.

default: gemini-3.1-pro   # cloud is the deliberate default; local profiles below still work via -m
worker: gemini-3.1-pro    # profile the background workers run on (WORKER_* env still overrides)
# Worker prompts are written for a capable model; `worker_adapt: small`
# on a profile splices in the conservative hedge rules when THAT profile
# runs the workers. With no worker profile at all, the built-in 4B
# fallback is hedged by default (WORKER_ADAPT in workers.py).
vault: ../testvault   # relative to this config file

# Local model servers, started/stopped with `tezcat-backends`.
# Profiles map to a backend by base_url. The harness only ever stops
# processes it started itself; a backend launched elsewhere shows as
# "external" and is left alone. Remote endpoints (the future homelab
# box) just have no entry here.
backends:
  mlx:
    url: http://127.0.0.1:8080/v1
    command: "uv tool run --from mlx-vlm mlx_vlm.server --model mlx-community/gemma-4-12B-it-4bit --port 8080"
  ollama:
    url: http://localhost:11434/v1
    command: "ollama serve"
    # env:
    #   OLLAMA_CONTEXT_LENGTH: "16384"
  mlx-worker:
    # Dedicated worker model (task extraction — src/tezcat_vault/workers.py).
    # --chat-template-args disables Qwen3.5's default thinking mode: with it
    # on, every reply hides in `reasoning` and the worker fails loud.
    # Chosen by worker-eval bakeoff (evals/reports/workers/); re-run the
    # suite before swapping it.
    url: http://127.0.0.1:8081/v1
    command: "uv tool run --from mlx-lm mlx_lm.server --model mlx-community/Qwen3.5-4B-MLX-4bit --port 8081 --chat-template-args '{\"enable_thinking\": false}'"

models:
  gemma4-12b-mlx:
    model: mlx-community/gemma-4-12B-it-4bit
    base_url: http://127.0.0.1:8080/v1   # mlx_vlm.server (mlx-lm can't load gemma4_unified)
    temperature: 0.2
    max_iterations: 15
    max_tool_result_chars: 24000   # ms-learn search returns ~23k chars; don't amputate it
    confirm_writes: true

  qwen3.5-9b:
    model: qwen3.5:9b-q4_K_M
    base_url: http://localhost:11434/v1
    temperature: 0.2
    max_iterations: 15
    max_tool_result_chars: 6000
    confirm_writes: true       # gate mutations on approval (spurious-write guard)
    worker_adapt: small        # hedged worker prompts; re-eval before dropping

  qwen3.5-4b:
    model: qwen3.5:4b-q4_K_M
    base_url: http://localhost:11434/v1
    temperature: 0.2
    max_iterations: 10
    max_tool_result_chars: 4000
    confirm_writes: true
    servers: [vault]        # 4b gets the minimal tool surface
    worker_adapt: small     # hedged worker prompts; re-eval before dropping

  # Cloud profiles. The cloud switch is deliberately ON: gemini-3.1-pro
  # is the default chat profile, reached DIRECTLY at the Google endpoint
  # with GEMINI_API_KEY from the gitignored .env.
  # Vault text (minus Private/, excluded in code) leaves the machine on
  # these profiles — the no-secrets rule (PHILOSOPHY.md I4) is
  # load-bearing here.
  #
  # Background workers follow the top-level `worker:` profile reference;
  # explicit WORKER_BASE_URL / WORKER_MODEL / WORKER_API_KEY env vars
  # override it, and with neither set workers fall back to the local
  # mlx-worker backend.

  # Flagship (most capable). The Pro tier is preview-only on the API
  # (no stable gemini-3.1-pro id exists yet); revisit the id when it
  # stabilizes.
  gemini-3.1-pro:
    model: gemini-3.1-pro-preview
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    temperature: 0.2
    max_iterations: 25         # frontier model: allow longer agentic runs
    max_tool_result_chars: 24000
    confirm_writes: true       # capability doesn't waive the write gate
    # Reasoning model: hidden thought spends the reply budget before the
    # JSON. 8000 still truncated the long grouping/schema_fix replies
    # intermittently (worker eval 2026-07-27); 16000 buys headroom.
    worker_max_tokens: 16000
    # Cloud sees the vault (minus Private/) and docs search — NEVER the
    # filesystem server. I4's spirit: what leaves the machine is the
    # vault's non-private content, nothing else. Filesystem search stays
    # available on the local profiles, where results never egress.
    servers: [vault, ms-learn]

  # Fast mid-tier — the sensible worker/daily-driver alternative.
  gemini-3.6-flash:
    model: gemini-3.6-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    temperature: 0.2
    max_iterations: 15
    max_tool_result_chars: 24000
    confirm_writes: true
    servers: [vault, ms-learn]   # cloud never sees the filesystem server
    worker_max_tokens: 16000     # reasoning headroom, same as the pro tier

  # Cheapest non-deprecated tier; kept for cost-sensitive one-offs.
  gemini-3.5-flash-lite:
    model: gemini-3.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    temperature: 0.2
    max_iterations: 15
    confirm_writes: true
    servers: [vault, ms-learn]   # cloud never sees the filesystem server

  # Example future entry for the 32GB network server:
  # homelab-70b:
  #   model: qwen3.5:72b
  #   base_url: http://192.168.1.50:8000/v1
  #   max_iterations: 25
  #   max_tool_result_chars: 12000
