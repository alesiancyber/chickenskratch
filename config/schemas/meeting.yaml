# Note entity: a meeting note's frontmatter.
type: object
required: [id, type, date, attendees]
properties:
  id:
    type: string
    pattern: "^m-[0-9a-f]{12}$"
  type:
    const: meeting
  date:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  attendees:
    type: array
    items:
      type: string
