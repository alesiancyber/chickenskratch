# Not a vault entity: the shape of a review-dashboard proposal file
# (data/proposals/*.json) — validated by
# the same jsonschema machinery as everything else. A proposal is data
# describing gated tool calls; approving it executes them through the
# normal snapshot-guaranteed vault operations.
type: object
required: [schema_version, id, kind, status, created, drafted_against, title, summary, apply]
properties:
  schema_version:
    const: 1
  id:
    type: string
    pattern: "^p-[0-9a-f]{12}$"
  kind:
    # a processor name (the registry is the authority on which exist —
    # enumerating them here would make a fourth processor a schema edit)
    type: string
    pattern: "^[a-z][a-z0-9_]*$"
  status:
    # `auto` = applied without a checkbox: a Spec.md-trusted processor's
    # draft that passed its deterministic verifier.
    # `failed` = approved but the apply raised (poison plan): resolved so
    # it can never wedge the engine in a retry loop.
    enum: [pending, approved, rejected, stale, auto, failed]
  created:
    type: string
  drafted_against:
    type: object
    required: [vault_sha, note, content_hash]
    properties:
      vault_sha:
        type: string
      note:
        type: string
      content_hash:
        type: string
      entity_ids:
        type: array
        items:
          type: string
  title:
    type: string
    minLength: 1
  summary:
    type: string
  issues:
    type: array
    items:
      type: string
  apply:
    type: array
    minItems: 1
    items:
      type: object
      required: [tool, args]
      properties:
        tool:
          enum: [update_frontmatter, replace_section, append_to_note,
                 add_task, set_task_status, set_task_due, set_task_scheduled,
                 add_card, move_card, create_note, replace_line,
                 archive_done_tasks]
        args:
          type: object
  needs_review:
    # set by a drafter that noticed something a human must see (e.g. an
    # impossible worker date was dropped): forces the checkbox even for
    # a trusted processor whose verifier passes
    type: boolean
  partial:
    # set when a decision trimmed the plan to a subset of its steps: the
    # trimmed file is the consent record, and on_applied hooks read this
    # (a partial capture approval must not clear the capture surface)
    type: boolean
  undo:
    # autonomy audit trail: the harness commits this proposal's apply
    # created (newest first) — reverting them all reverts the decision
    type: array
    items:
      type: string
  verifier_failures:
    # autonomy: full only — the proposal applied although its verifier
    # could not vouch; these strings are what it objected to. The audit
    # trail for the standing grant.
    type: array
    items:
      type: string
  pairs:
    # overlap proposals: the judged [a, b] id pairs, 1:1 with apply steps.
    # Resolved proposals' pairs are the dismissal memory — a pair a human
    # rejected is never re-asked while the file lives (queue retention)
    type: array
    items:
      type: array
      items:
        type: string
      minItems: 2
      maxItems: 2
  folders:
    # spec_drift proposals: the top-level folders offered for the map.
    # A rejected proposal's folders are the dismissal memory — the scan
    # stops offering them while the file lives (queue retention)
    type: array
    items:
      type: string
  resolved:
    type: ["object", "null"]
