# MCP servers the harness can connect to.
#
# transport: stdio (command) or http (streamable HTTP url).
# Placeholders: {python} -> current interpreter, {vault} -> resolved vault path.
# enabled: false keeps a server configured but disconnected.
# assume_read_only: treat this server's tools as read-only even if they don't
#   declare MCP readOnlyHint annotations (external tools without annotations
#   are otherwise treated as writes and gated by confirm_writes profiles).
#
# Profiles in models.yaml can narrow this further with a `servers:` allowlist.

servers:
  obsidian:
    transport: stdio
    command: ["{python}", "-m", "obsidian_mcp.server"]
    env:
      OBSIDIAN_VAULT_PATH: "{vault}"
    enabled: true

  files:
    transport: stdio
    command: ["{python}", "-m", "files_mcp.server"]
    env:
      FILES_ROOTS: "~"       # colon-separated allowlist of searchable dirs
    enabled: true
    # tools declare readOnlyHint themselves — never approval-gated

  ms-learn:
    transport: http
    url: https://learn.microsoft.com/api/mcp
    enabled: true
    assume_read_only: true   # docs search/fetch only

  atlassian:
    transport: http
    url: https://mcp.atlassian.com/v1/mcp/authv2
    enabled: false           # needs OAuth 2.1 — Phase 2 M5
