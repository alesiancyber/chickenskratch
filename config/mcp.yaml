# MCP servers the harness can connect to.
#
# transport: stdio (command) or http (streamable HTTP url).
# Placeholders: {python} -> current interpreter, {vault} -> resolved vault path.
# enabled: false keeps a server configured but disconnected.
# assume_read_only: treat this server's tools as read-only even if they don't
#   declare MCP readOnlyHint annotations (external tools without annotations
#   are otherwise treated as writes and gated by confirm_writes profiles).
# docs_domain: marks a documentation source. Search results get digested into
#   ranked link lists, and any answer built on this server's tools is
#   guaranteed to cite URLs from this domain (appended if the model omits
#   them). Adding another docs server is just another entry with this key.
#
# Profiles in models.yaml can narrow this further with a `servers:` allowlist.

servers:
  vault:
    transport: stdio
    command: ["{python}", "-m", "chickenskratch_vault.server"]
    env:
      CHICKENSKRATCH_VAULT_PATH: "{vault}"
    enabled: true

  files:
    transport: stdio
    command: ["{python}", "-m", "chickenskratch_files.server"]
    env:
      FILES_ROOTS: "~"       # colon-separated allowlist of searchable dirs
    enabled: true
    # tools declare readOnlyHint themselves — never approval-gated.
    # LOCAL profiles only: every cloud profile in models.yaml allowlists
    # this server away (`servers: [vault, ms-learn]`) — filesystem
    # content must never ride into cloud context (I4's spirit; the vault
    # already excludes Private/ at its own layer).

  ms-learn:
    transport: http
    url: https://learn.microsoft.com/api/mcp
    enabled: true
    assume_read_only: true   # docs search/fetch only
    docs_domain: learn.microsoft.com

  atlassian:
    transport: http
    url: https://mcp.atlassian.com/v1/mcp/authv2
    enabled: false           # needs OAuth 2.1 — Phase 2 M5
