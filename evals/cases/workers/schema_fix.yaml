- name: schema-tasks-stamp-two-in-order
  worker: schema_fix
  note: "Tasks/Backlog.md"
  entity: task
  new_id: "n-000000000000"
  extra_ids: ["t-aaaaaaaaaaa1", "t-aaaaaaaaaaa2"]
  issues:
    - "line 3: id: None is not of type 'string'"
    - "line 4: id: None is not of type 'string'"
  content: |
    # Backlog

    - [ ] buy replacement UPS batteries
    - [ ] call the vendor about renewal
  # ids must land in file order, appended as trailing block refs
  after_contains:
    - "buy replacement UPS batteries \\^t-aaaaaaaaaaa1"
    - "call the vendor about renewal \\^t-aaaaaaaaaaa2"

- name: schema-tasks-stamp-preserves-metadata
  worker: schema_fix
  note: "Tasks/Ops.md"
  entity: task
  new_id: "n-000000000000"
  extra_ids: ["t-bbbbbbbbbbb1"]
  issues:
    - "line 3: id: None is not of type 'string'"
  content: |
    # Ops

    - [ ] rotate the DKIM keys ⏫ 📅 2026-08-01
    - [ ] archive old logs ^t-ccccccccccc9
  # emoji metadata stays byte-identical, the ref lands LAST on the line,
  # and the already-stamped neighbor is untouched
  after_contains:
    - "rotate the DKIM keys ⏫ 📅 2026-08-01 \\^t-bbbbbbbbbbb1"
    - "archive old logs \\^t-ccccccccccc9"

- name: schema-typo-is-not-ours-to-fix
  worker: schema_fix
  note: "Tasks/Chores.md"
  entity: task
  new_id: "n-000000000000"
  extra_ids: ["t-ddddddddddd1"]
  issues:
    - "line 3: id: None is not of type 'string'"
  content: |
    # Chores

    - [ ] verfy teh backup restore path
  # the misspelling is the user's text: stamp it, never correct it
  after_contains: ["verfy teh backup restore path \\^t-ddddddddddd1"]
