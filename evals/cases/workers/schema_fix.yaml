# Judgment cases for the schema_fix worker — the gap flagged in the
# 2026-07-23 review: this worker ran in production with zero eval
# coverage. Run live:  uv run chickenskratch-worker-eval -k schema
#
# Case schema (worker: schema_fix):
#   note, entity, issues, content:  what scan_schema hands the drafter
#   new_id, extra_ids:              the pre-allocated ids (fixed, so
#                                   expectations are deterministic)
#   after_contains / after_not_contains: regexes checked against the
#                                   SIMULATED post-fix note
#
# Every case is additionally scored by the PRODUCTION verifier
# (verify_schema_fix): only additive structure, every user line
# byte-identical modulo appended block refs, and the result must fully
# conform — i.e. a case passes only if the fix would have auto-applied.

- name: schema-meeting-missing-id
  worker: schema_fix
  note: "Meetings/2026-07-15 Sprint Sync.md"
  entity: meeting
  new_id: "m-0123456789ab"
  issues:
    - "(root): 'id' is a required property"
  content: |
    ---
    date: '2026-07-15'
    type: meeting
    attendees: [Sam, Rio]
    ---
    # Sprint Sync

    ## Notes

    Velocity is fine. Rio demoed the new dashboard.
  after_contains: ["id: m-0123456789ab"]
  after_not_contains: ["id: m-0123456789ab[\\s\\S]*id: m-0123456789ab"]  # exactly once

- name: schema-meeting-date-from-filename
  worker: schema_fix
  note: "Meetings/2026-07-15 Incident Retro.md"
  entity: meeting
  new_id: "m-00aa11bb22cc"
  issues:
    - "(root): 'id' is a required property"
    - "(root): 'date' is a required property"
  content: |
    ---
    type: meeting
    attendees: [Dana]
    ---
    # Incident Retro

    Root cause was the expired cert. Dana will write the timeline.
  # the date is knowable — it is in the note's own path
  after_contains: ["id: m-00aa11bb22cc", "date: '?2026-07-15"]

- name: schema-meeting-prose-untouched
  worker: schema_fix
  note: "Meetings/2026-07-10 Vendor Call.md"
  entity: meeting
  new_id: "m-feedbeefcafe"
  issues:
    - "(root): 'id' is a required property"
  content: |
    ---
    date: '2026-07-10'
    type: meeting
    attendees: [Marcus]
    ---
    # Vendor Call

    They was very insistent about the renewal pricing. Their are two
    tiers we could pick.
  # grammar errors in the user's prose are the user's business: the fix
  # must not "helpfully" reword anything (the verifier enforces this;
  # the pins make the temptation explicit)
  after_contains: ["They was very insistent", "Their are two"]

