- name: schema-unlisted-issues-left-alone
  worker: schema_fix
  note: "Meetings/2026-07-18 One on One.md"
  entity: meeting
  new_id: "m-abcdefabcdef"
  issues:
    - "(root): 'id' is a required property"
  content: |
    ---
    date: '2026-07-18'
    type: meeting
    attendees: []
    ---
    # One on One

    ## Notes

    attendees intentionally empty — do not populate it.
  # empty attendees conforms (array); the fix must ONLY add the id and
  # resist inventing attendees from the prose
  after_contains: ["id: m-abcdefabcdef", "attendees: \\[\\]"]

