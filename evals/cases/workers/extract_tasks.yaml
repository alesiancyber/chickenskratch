# Judgment cases for the extract_tasks worker (DESIGN-mixed-models.md §7.4).
# Run live:  uv run tezcat-worker-eval -m <worker model>
# Scored structurally against the returned JSON, never against prose.
#
# Expectation schema per case:
#   expect:       list of tasks that must be returned
#     match:      regex that must hit one returned task's text
#     due:        checked only if the key is present (explicit null = must be null)
#     priority:   same rule
#   exact: true   returned count must equal len(expect) — extras are failures
#   forbid_text:  regexes that must not appear in any returned task text
#
# Date placeholders ({today}, {tomorrow}, {plus5}, {plus14}, ...) resolve at
# run time in both the input text and the expectations, so cases never go stale.

- name: urgent-priority-mapping
  text: |
    Quick recap from standup: the cert on the mail server expires soon and
    Sam said it's urgent — renew it today. Nothing else blocking.
  expect:
    - match: "(?i)cert"
      due: "{today}"
      priority: highest
  forbid_text: ["(?i)urgent"]   # priority word must not leak into the task text
  exact: true

# Regression #1: the first live smoke test (commit b15b876) dropped the
# no-deadline "someday" item entirely. Policy: return it with due null.
- name: someday-item-kept
  text: |
    Meeting wrapped early. One thought that came up: someday we should
    redesign the pricing page, no rush at all. Also confirmed the offsite
    is already booked.
  expect:
    - match: "(?i)pricing page"
      due: null
      # priority deliberately unchecked: "no rush at all" -> low is a
      # defensible inference (qwen3.5-4b makes it). The regression being
      # pinned is dropping the item or inventing a date, not the
      # priority reading.
  exact: true

- name: relative-date-two-weeks
  text: |
    Nadia will send the vendor contract, and someone on our side needs to
    review it in two weeks.
  expect:
    - match: "(?i)send the vendor contract"
      owed_by: "Nadia"
    - match: "(?i)review"
      due: "{plus14}"
      owed_by: null
  exact: true

- name: owed-commitment-followup
  text: |
    Marcus said he'll get me the firewall logs by {tomorrow}. Once they
    arrive I need to draft the Sigma detection rule.
  expect:
    - match: "(?i)firewall logs"
      owed_by: "Marcus"
      due: "{tomorrow}"
    - match: "(?i)[Ss]igma detection rule"
      owed_by: null
  exact: true

- name: completed-item-excluded
  text: |
    Status: Priya already migrated the DNS records yesterday, so that's
    done. Remaining: schedule the postmortem for tomorrow.
  expect:
    - match: "(?i)postmortem"
      due: "{tomorrow}"
  forbid_text: ["(?i)dns"]
  exact: true

- name: no-tasks-pure-status
  text: |
    FYI — the deploy went out clean, dashboards look normal, and the
    support queue is quiet. No action needed from anyone.
  expect: []
  exact: true

- name: decision-is-not-a-task
  text: |
    After the debate we decided to go with Postgres over SQLite. Everyone
    agreed the migration plan Marcus drafted is fine as written.
  expect: []
  exact: true

- name: multiple-tasks-mixed
  text: |
    Notes from planning: Sam needs to file the quarterly taxes by {plus5}
    — that one's high priority. Someone should also update the onboarding
    doc, no deadline. And urgent: rotate the leaked API key today.
  expect:
    - match: "(?i)tax"
      due: "{plus5}"
      priority: high
    - match: "(?i)onboarding"
      due: null
    - match: "(?i)api key|rotate"
      due: "{today}"
      priority: highest
  exact: true

- name: date-not-repeated-in-text
  text: |
    Remind me that I have to submit the expense report tomorrow.
  expect:
    - match: "(?i)expense report"
      due: "{tomorrow}"
  forbid_text: ["(?i)tomorrow"]
  exact: true

# ---- 2026-07-23 expansion: negation, ownership, dates, noise ----

- name: cancelled-plan-is-not-a-task
  text: |
    Update: we cancelled the office move entirely, so no need to get
    quotes from movers anymore. Nothing to do here.
  expect: []
  exact: true

- name: negated-instruction-not-inverted
  text: |
    Do NOT deploy the new detection pack yet — legal review first. Sam
    owns scheduling that review for {plus3}.
  expect:
    - match: "(?i)legal review|schedule.*review"
      due: "{plus3}"
      owed_by: "Sam"
  # the regression pinned: the negation must never invert into an
  # affirmative "deploy the pack" task. Capturing the hold itself
  # ("do not deploy until...") is a defensible extra, so no exact count.
  forbid_text: ["(?i)^deploy"]

- name: two-people-owe-things
  text: |
    From the sync: Dana will send over the IR runbook draft, and Marcus
    committed to getting us VPN access by {plus5}. I just need to review
    both once they land.
  expect:
    - match: "(?i)runbook"
      owed_by: "Dana"
    - match: "(?i)vpn access"
      owed_by: "Marcus"
      due: "{plus5}"
    - match: "(?i)review"
      owed_by: null
  exact: true

- name: delegated-by-me-is-owed
  text: |
    I told Priya to update the on-call rotation doc before Friday's
    handoff. I'll take the pager myself this weekend.
  expect:
    - match: "(?i)on-call rotation"
      owed_by: "Priya"
  exact: false

- name: waiting-on-phrasing
  text: |
    Still waiting on Northwind to deliver the Q2 detection coverage
    report. Meanwhile I should map our log sources against MITRE.
  expect:
    - match: "(?i)coverage report"
      owed_by: "Northwind"
    - match: "(?i)mitre|log sources"
      owed_by: null
  exact: true

- name: critical-severity-mapping
  text: |
    Heads up — CVE in the edge gateway, actively exploited. Patching it
    is critical, do it today.
  expect:
    - match: "(?i)patch|gateway"
      due: "{today}"
      priority: highest
  exact: true

- name: low-priority-phrasing
  text: |
    Whenever there's a spare moment, no urgency at all: tidy up the tags
    in the research notes.
  expect:
    - match: "(?i)tags|tidy"
      due: null
      priority: lowest
  exact: true

- name: numbers-are-not-dates
  text: |
    Order 3 replacement YubiKeys for the new hires and put them in
    lockbox 7.
  expect:
    - match: "(?i)yubikey"
      due: null
  exact: true

- name: in-a-week-relative-date
  text: |
    The trial license expires in a week — decide whether we're buying
    Obsidian Sync before then.
  expect:
    - match: "(?i)obsidian sync|decide|buying"
      due: "{plus7}"
  exact: true

- name: eod-tomorrow
  text: |
    Finance needs the reconciled invoice list by end of day tomorrow.
  expect:
    - match: "(?i)invoice"
      due: "{tomorrow}"
  exact: true

- name: duplicate-mention-extracted-once
  text: |
    Don't forget to renew the wildcard cert. Seriously — the wildcard
    cert renewal is the one thing that cannot slip this week.
  expect:
    - match: "(?i)wildcard cert"
  exact: true

- name: reference-material-is-not-a-task
  text: |
    Notes from the SANS course: analysts should always pivot on the
    process tree, and defenders should baseline PowerShell usage per
    host. Good background reading overall.
  expect: []
  exact: true

- name: task-buried-mid-paragraph
  text: |
    The audit went smoothly and the auditors were friendly, though while
    walking them through the DMZ diagram I realized the firewall rule
    export is stale and I have to regenerate it before {plus7}, which is
    when they come back. Lunch afterwards was decent.
  expect:
    - match: "(?i)firewall rule export|regenerate"
      due: "{plus7}"
  exact: true

- name: braindump-fragments
  text: |
    laptop battery swelling - replace
    ask alex re: sso timeline
    gym membership??
  expect:
    - match: "(?i)laptop|battery"
    - match: "(?i)alex.*sso|sso.*alex"
  exact: false

- name: forwarded-email-style
  text: |
    FW: from IT — "All staff must re-enroll MFA devices by {plus14}.
    Managers: confirm your team's completion." I manage nobody but I do
    have two MFA devices.
  expect:
    - match: "(?i)mfa"
      due: "{plus14}"
  exact: false
  forbid_text: ["(?i)confirm your team"]

- name: past-recap-plus-single-action
  text: |
    Shipped the detection pack, closed out the phishing incident, and
    presented the metrics deck. Last thing left from the sprint: write
    the retro doc.
  expect:
    - match: "(?i)retro"
      due: null
  forbid_text: ["(?i)phishing incident", "(?i)metrics deck"]
  exact: true

- name: suggestion-we-should-is-a-task
  text: |
    Thinking about it more — we should really add canary tokens to the
    file shares. Not urgent, just don't want to lose the idea.
  expect:
    - match: "(?i)canary token"
      due: null
  exact: true

- name: date-and-priority-both-stated
  text: |
    High priority: submit the SOC 2 evidence bundle by {plus5}.
  expect:
    - match: "(?i)soc 2|evidence"
      due: "{plus5}"
      priority: high
  forbid_text: ["(?i)high priority"]
  exact: true

# ---- paraphrase triangulation (2026-07-23): the same judgment through
# different surface wording. A model that holds the rule passes the
# cluster; a model that pattern-matched one phrasing does not. ----

# cluster: negation must never invert (pairs with negated-instruction-not-inverted)
- name: negation-hold-off-variant
  text: |
    Hold off on emailing the customer list until Dana signs off — she
    said she'll have the sign-off done by {tomorrow}.
  expect:
    - match: "(?i)sign.?off"
      owed_by: "Dana"
      due: "{tomorrow}"
  forbid_text: ["(?i)^email the customer list"]

# cluster: cancelled work leaves no task (pairs with cancelled-plan-is-not-a-task)
- name: cancellation-scrapped-variant
  text: |
    We scrapped the webinar idea completely, so the venue search is dead.
    One cleanup item remains: cancel the venue deposit.
  expect:
    - match: "(?i)deposit"
  forbid_text: ["(?i)search"]
  exact: true

# cluster: completed work excluded (pairs with completed-item-excluded)
- name: already-handled-variant
  text: |
    The security review's already been handled by Priya as of last week.
    What remains is publishing the findings internally.
  expect:
    - match: "(?i)publish"
  exact: true

# cluster: owed_by attribution (pairs with owed-commitment-followup)
- name: promised-phrasing-variant
  text: |
    Alex promised the pentest report will be in my inbox by {plus3}.
    After it lands I'll summarize it for leadership.
  expect:
    - match: "(?i)pentest report"
      owed_by: "Alex"
      due: "{plus3}"
    - match: "(?i)summari"
      owed_by: null
  exact: true

- name: going-to-send-variant
  text: |
    Camille is going to send over the corrected budget numbers. Once they
    arrive, load them into the tracker.
  expect:
    - match: "(?i)budget numbers"
      owed_by: "Camille"
    - match: "(?i)tracker|load"
      owed_by: null
  exact: true

# cluster: urgency wording -> priority (pairs with urgent-priority-mapping)
- name: drop-everything-priority-variant
  text: |
    Drop everything: last night's customer database backup failed —
    rerun it now.
  expect:
    - match: "(?i)backup"
      priority: highest
  exact: true

# cluster: pure status yields nothing (pairs with no-tasks-pure-status)
- name: weekly-wrap-no-tasks-variant
  text: |
    Weekly wrap: all detections green, on-call was quiet, and the audit
    binder shipped on time. Great week — nothing carries over.
  expect: []
  exact: true

# cluster: agreement is not a task (pairs with decision-is-not-a-task)
- name: signoff-not-a-task-variant
  text: |
    Sign-off is complete — everyone approved the new retention policy as
    written, and it takes effect next quarter automatically.
  expect: []
  exact: true

# cluster: someday kept with null date (pairs with someday-item-kept)
- name: ought-to-someday-variant
  text: |
    At some point we really ought to consolidate the three logging
    pipelines into one. Zero urgency on this.
  expect:
    - match: "(?i)consolidate|logging pipeline"
      due: null
  exact: true

# cluster: relative dates (pairs with relative-date-two-weeks / in-a-week)
- name: in-five-days-variant
  text: |
    The draft SOW needs a review pass in five days.
  expect:
    - match: "(?i)sow|review"
      due: "{plus5}"
  exact: true

# cluster: buried task (pairs with task-buried-mid-paragraph)
- name: buried-task-variant
  text: |
    Toured the new colo cage today — power feeds are redundant, cooling
    headroom is fine, badge process painless, though while checking the
    racks I noticed the NAS has a failing disk that I need to swap
    before {plus5}, and then the drive back took two hours in traffic.
  expect:
    - match: "(?i)disk|nas"
      due: "{plus5}"
  exact: true

# cluster: duplicate mention extracted once (pairs with duplicate-mention-extracted-once)
- name: dedupe-reworded-variant
  text: |
    Rotate the admin API keys before the audit. And to repeat myself:
    those admin keys really do need rotating first.
  expect:
    - match: "(?i)admin.*keys|keys"
  exact: true

# Week-granular plan language: "this week"/"next week" are PLANS (⏳,
# Sunday-anchored), never deadlines; deadline words still land in due.
- name: extract-week-plans-vs-deadlines
  text: |
    Sort out the vendor contract this week. Next week I should start the
    budget review. Send the SOW to legal by {tomorrow}.
  expect:
    - match: "(?i)vendor contract"
      due: null
      scheduled: "{this_sunday}"
    - match: "(?i)budget review"
      due: null
      scheduled: "{next_sunday}"
    - match: "(?i)SOW"
      due: "{tomorrow}"
      scheduled: null

# The dependency rule (base prompt, loose tier): "X is blocking me" is
# at least TWO items — the reader's own move (owed_by null) and what the
# blocker owes (owed_by set; teams count, not just names). Regression:
# "SOC is a blocker" came back as one bare task and no waiting-on row.
# Deliberately NOT exact: splitting the SOC side into unblock + heads-up
# is finer judgment, not a failure (gemini does it 1 run in 3). Under
# WORKER_ADAPT=small the hedges soften the split rule on purpose — this
# case grades the loose tier.
- name: blocker-splits-into-task-and-owed
  text: |
    SOC is a blocker on the sentinel rollout. I need to let them know
    about the change freeze, and then they need to unblock us and give
    me a heads up once it's clear.
  expect:
    - match: "(?i)let .*know|inform|notify|tell"
      owed_by: null
    - match: "(?i)unblock|heads.?up|clear"
      owed_by: "SOC"
